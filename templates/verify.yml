# Browser-free CI for a dsh plugin.
#
# The browser suites are deliberately absent: they need a running GUI, a signed
# gate cookie, and a real Chrome, none of which a clean runner has. They stay a
# local acceptance step. What runs here is everything provable from files.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      # One Node failure should not hide the others: this plugin must work on
      # every supported runtime, not just the newest.
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Catches the self-invented-field failure mode: a manifest that looks
      # right but omits the two fields the kernel actually reads.
      - name: Plugin manifest is valid
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch');
            if (p.dsh?.client?.platform !== 'web') throw new Error('missing dsh.client.platform');
            if (!p.exports?.['./client']) throw new Error('missing exports[\"./client\"]');
            console.log('manifest ok');
          "

      - name: Every file parses
        run: |
          for f in lib/*.js tools/*.mjs; do
            node --check "$f" || exit 1
          done
          echo "all files parse"

      # Suites must synthesize their own fixtures when no session tree exists,
      # otherwise CI silently skips the real checks.
      - name: Host suite
        run: node tools/verify-host.mjs || node tools/verify-host.mjs "${RUNNER_TEMP}/sessions"

      - name: HTTP suite
        run: node tools/verify-http.mjs

      - name: Client bundle suite
        run: node tools/verify-client.mjs

      # Fails the build if a credential or an absolute author path ever lands.
      # Patterns require the payload after the prefix: bare `gho_` and
      # `dsh-auth-` appear legitimately inside these very patterns, and this
      # workflow file is itself scanned, so a prefix-only match self-triggers.
      - name: No secrets or machine paths committed
        run: |
          if grep -rnE 'gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|dsh-auth-[A-Za-z0-9_-]{20,}|v1\.eyJ[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
               --include='*.js' --include='*.mjs' --include='*.ps1' --include='*.json' --include='*.yml' . ; then
            echo "::error::credential-shaped string committed"; exit 1
          fi
          if grep -rnE 'C:\\\\Users\\\\[A-Za-z]+|/Users/[A-Za-z]+/|/home/[A-Za-z]+/' \
               --include='*.js' --include='*.mjs' --include='*.ps1' . ; then
            echo "::error::absolute author path committed"; exit 1
          fi
          echo "clean"
